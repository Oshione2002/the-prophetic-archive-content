name: Apply reviewed Scroll paragraphs
on:
  push:
    branches:
      - scrolls-word-replacement-2026-10-24
    paths:
      - 'migration/scrolls_reviewed_paragraphs.json'
      - 'migration/update_scroll_json.py'
      - '.github/workflows/apply-reviewed-scrolls.yml'
permissions:
  contents: write
jobs:
  replace-scroll-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace scroll JSON blocks and validate hashes
        run: python3 migration/update_scroll_json.py
      - name: Commit verified scroll JSON to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/prophetic-scrolls manifests/prophetic-scrolls.json migration/scrolls_replacement_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply reviewed 325 Scroll JSON documents and manifest hashes"
          git push origin HEAD:scrolls-word-replacement-2026-10-24
