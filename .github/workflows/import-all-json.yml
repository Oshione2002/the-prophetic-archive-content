name: Import all generated JSON

on:
  push:
    paths:
      - 'bulk-json/**'

permissions:
  contents: write

jobs:
  import-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for all archive chunks
        id: chunks
        shell: bash
        run: |
          set -euo pipefail
          expected=(bulk-json/chunk-00.b64 bulk-json/chunk-01.b64 bulk-json/chunk-02.b64 bulk-json/chunk-03.b64 bulk-json/chunk-04.b64)
          for file in "${expected[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Waiting for $file"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Reassemble and import JSON repository
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prophetic-json
          cat bulk-json/chunk-00.b64 bulk-json/chunk-01.b64 bulk-json/chunk-02.b64 bulk-json/chunk-03.b64 bulk-json/chunk-04.b64 | base64 --decode > /tmp/prophetic-json/archive.tar.xz
          tar -xJf /tmp/prophetic-json/archive.tar.xz -C /tmp/prophetic-json
          src=/tmp/prophetic-json/the-prophetic-archive-content-json

          mkdir -p content manifests
          cp -a "$src/content/." content/
          cp -a "$src/manifests/." manifests/
          cp "$src/catalogue.json" catalogue.json
          cp "$src/PROCESSING_NOTES.json" PROCESSING_NOTES.json
          cp "$src/validation_report.json" validation_report.json

          # The temporary transport chunks are no longer needed after import.
          rm -rf bulk-json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content manifests catalogue.json PROCESSING_NOTES.json validation_report.json bulk-json

          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi

          git commit -m "Import complete generated archive JSON dataset"
          git push origin HEAD:main
