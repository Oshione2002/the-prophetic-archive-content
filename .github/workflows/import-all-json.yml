name: Import all generated JSON

on:
  push:
    paths:
      - 'bulk-json/**'

permissions:
  contents: write

jobs:
  import-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check transport is ready
        id: chunks
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bulk-json/READY ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(find bulk-json -maxdepth 1 -type f -name 'part-*.b64' | wc -l)
          if [[ "$count" -ne 68 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Expected 68 transport parts, found $count."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Reassemble and import JSON repository
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prophetic-json
          cat $(find bulk-json -maxdepth 1 -type f -name 'part-*.b64' | sort) | base64 --decode > /tmp/prophetic-json/archive.tar.xz
          echo "bb6df5d8f45d2440be70ee1bbdd70083ce1cfd68a06b2922fd1c1bd9be0d31f0  /tmp/prophetic-json/archive.tar.xz" | sha256sum -c -
          tar -xJf /tmp/prophetic-json/archive.tar.xz -C /tmp/prophetic-json
          src=/tmp/prophetic-json/prophetic_json_min

          mkdir -p content manifests
          cp -a "$src/content/." content/
          cp -a "$src/manifests/." manifests/
          cp "$src/catalogue.json" catalogue.json
          cp "$src/PROCESSING_NOTES.json" PROCESSING_NOTES.json
          cp "$src/validation_report.json" validation_report.json
          rm -rf bulk-json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content manifests catalogue.json PROCESSING_NOTES.json validation_report.json bulk-json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi
          git commit -m "Import complete generated archive JSON dataset"
          git push origin HEAD:main
